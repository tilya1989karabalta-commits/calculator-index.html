<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар тандоо системасы</title>
    
    <!-- Поиск тизмесинин дизайны үчүн китепкана (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    
    <style>
        /* Сайттын жалпы караңгы темасы (Скриншотко окшоштурулду) */
        body {
            background-color: #1a1a1a; /* Караңгы фон */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: #2b2b2b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Тизменин жанындагы текст */
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 16px;
            color: #e0e0e0;
        }

        /* --- Tom Select (Поиск тизмесин) караңгы темага ылайыктоо --- */
        .ts-wrapper.single .ts-control {
            background-color: #333333; /* Тизменин ички фону */
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
        }

        .ts-wrapper.single.focus .ts-control {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
        }

        /* Тизме ачылгандагы фон */
        .ts-dropdown {
            background-color: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        /* Товарлардын тизмеси */
        .ts-dropdown .option {
            padding: 12px;
            border-bottom: 1px solid #3a3a3a;
            font-size: 15px;
        }

        /* Курсорду алып баргандагы түс */
        .ts-dropdown .option:hover, 
        .ts-dropdown .option.active {
            background-color: #0056b3;
            color: #fff;
        }

        /* Поиск жазуучу жер (Лупа болгон инпут) */
        .ts-dropdown .dropdown-input-wrap {
            padding: 10px;
            background-color: #333;
            border-bottom: 1px solid #444;
        }

        /* Поиск жазуучу инпуттун өзү */
        .ts-dropdown .dropdown-input {
            background-color: #1a1a1a;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 10px 10px 10px 35px; /* Сол жагында лупа үчүн боштук */
            width: 100%;
            box-sizing: border-box;
        }

        /* Лупанын сүрөтүн инпуттун ичине коюу */
        .ts-dropdown .dropdown-input-wrap::before {
            content: '🔍'; /* Лупанын белгиси */
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #888;
            pointer-events: none;
        }
        
        .ts-dropdown .dropdown-input:focus {
            outline: none;
            border-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="container">
        <label for="product-select">Товарды тандаңыз:</label>
        
        <!-- Бул жерге өзүңүздүн товарларыңызды жазасыз -->
        <select id="product-select" placeholder="-- Товар издөө (Издөө)...">
            <option value="">-- Товар тандаңыз --</option>
            <option value="1">Чехол для планшета — 280 сом/шт</option>
            <option value="2">Зарядка на редмм турбо — 400 сом/шт</option>
            <option value="3">Кабель type-c — 200 сом/шт</option>
            <!-- Жаңы товарларды ушул жерге <option> теги менен кошуп отурасыз -->
            <option value="4">Корпус для телефона — 150 сом/шт</option>
            <option value="5">Наушники TWS — 1200 сом/шт</option>
        </select>
    </div>

    <!-- JavaScript китепканасы (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    
    <script>
        // Тизмени иштетүү жана поиск кошуу
        document.addEventListener('DOMContentLoaded', function() {
            new TomSelect("#product-select", {
                create: false, // Жаңы товар жазууга жол бербейт (тек тандоо)
                sortField: {
                    field: "text",
                    direction: "asc" // Товарларды алфавит боюнча иреттейт
                },
                onDropdownOpen: function(dropdown) {
                    // Поиск талаасындагы текстти кыргызча кылып коюу
                    const searchInput = dropdown.querySelector('input');
                    if (searchInput) {
                        searchInput.placeholder = "Товар издөө...";
                    }
                },
                render: {
                    no_results: function(data, escape) {
                        return '<div class="no-results" style="padding: 10px; color: #ff6b6b;">Эч нерсе табылган жок: "' + escape(data.input) + '"</div>';
                    }
                }
            });
        });
    </script>

</body>
</html>
